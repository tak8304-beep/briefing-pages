<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f5eff" />
  <title>경제 브리핑</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="static-shim.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>경제 브리핑</h1>
        <span id="today" class="today"></span>
      </div>
      <nav class="tabs" role="tablist" aria-label="브리핑">
        <button class="tab" role="tab" data-tab="news" aria-selected="true">뉴스</button>
        <button class="tab" role="tab" data-tab="market" aria-selected="false">증시</button>
        <button class="tab" role="tab" data-tab="picks" aria-selected="false">종목</button>
      </nav>
      <div class="actions">
        <span id="updated" class="updated"></span>
        <button id="refresh" class="refresh" title="지금 탭의 브리핑을 새로 만듭니다">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.4 5H17v2h6V5h-2v2.3A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8Zm8 8a8 8 0 0 1-14.9 4H7v-2H1v6h2v-2.3A10 10 0 0 0 22 12h-2Z"/></svg>
          <span>새로고침</span>
        </button>
      </div>
    </header>

    <main class="content">
      <div id="banner" class="banner" hidden></div>
      <section id="panel-news" class="panel" role="tabpanel"></section>
      <section id="panel-market" class="panel" role="tabpanel" hidden></section>
      <section id="panel-picks" class="panel" role="tabpanel" hidden></section>
    </main>

    <aside class="side">
      <nav class="side-tabs" role="tablist" aria-label="사이드">
        <button class="side-tab" role="tab" data-side="fx" aria-selected="true">환율</button>
        <button class="side-tab" role="tab" data-side="indices" aria-selected="false">지수</button>
        <button class="side-tab" role="tab" data-side="terms" aria-selected="false">용어</button>
      </nav>
      <section id="side-fx" class="side-panel">
        <ul id="fx" class="quotes"></ul>
        <p id="fx-meta" class="side-meta"></p>
      </section>
      <section id="side-indices" class="side-panel" hidden>
        <ul id="indices" class="quotes"></ul>
        <p id="indices-meta" class="side-meta"></p>
      </section>
      <section id="side-terms" class="side-panel" hidden>
        <div id="terms"></div>
      </section>
    </aside>
  </div>

  <!-- 핸드폰 화면에서만 보이는 하단 탭 -->
  <nav class="bottom-nav" aria-label="화면 전환">
    <button data-view="news"><span class="bn-ico" aria-hidden="true">📰</span>뉴스</button>
    <button data-view="market"><span class="bn-ico" aria-hidden="true">📈</span>증시</button>
    <button data-view="picks"><span class="bn-ico" aria-hidden="true">🎯</span>종목</button>
    <button data-view="quotes"><span class="bn-ico" aria-hidden="true">💱</span>시세</button>
    <button data-view="terms"><span class="bn-ico" aria-hidden="true">📖</span>용어</button>
  </nav>
  <script src="app.js"></script>
</body>
</html>
